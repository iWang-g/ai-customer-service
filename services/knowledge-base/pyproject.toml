[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-service-knowledge-base"
version = "0.1.0"
description = "Local-first knowledge base service for AI customer service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "Pillow>=11.0,<13.0",
]

[project.scripts]
knowledge-base = "app.main:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
